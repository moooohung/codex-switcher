name: Pull Request Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.11.2"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - name: Run frontend tests
        run: pnpm test

  rust:
    name: Rust tests and format
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.11.2"

      - name: Build embedded frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Check changed Rust formatting
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA="$(git rev-parse "${HEAD_SHA}^")"
          fi
          changed_files="$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- 'src-tauri/**/*.rs')"
          if [[ -n "$changed_files" ]]; then
            mapfile -t files <<< "$changed_files"
            rustfmt --edition 2021 --check --config skip_children=true "${files[@]}"
          fi

      - name: Run Rust tests
        # Auth fixtures change process-wide home variables and inspect global
        # operation locks. Serialize the harness; individual concurrency tests
        # still create their own competing threads/processes.
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml -- --test-threads=1

  platform-check:
    name: Platform compile (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.11.1"
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: "12.11.2"

      - name: Build embedded frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Compile platform-specific Rust
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml
