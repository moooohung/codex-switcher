name: Updater regression tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  updater-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.11.1"
      - name: Run updater regression tests
        run: npm run test:updater
