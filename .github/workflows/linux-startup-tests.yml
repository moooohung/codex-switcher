name: Linux startup regression tests

on:
  pull_request:
  push:
    branches: [main, 'fix/**']

permissions:
  contents: read

jobs:
  linux-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: '1.99.0'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.11.1"
      - name: Test GTK module filtering
        run: |
          rustc --edition=2021 --test src-tauri/src/linux_gtk.rs -o "$RUNNER_TEMP/linux-gtk-tests"
          "$RUNNER_TEMP/linux-gtk-tests"
      - name: Test the Linux entry point before Tauri initialization
        run: node --experimental-strip-types --test tests/linuxGtkStartup.test.ts
